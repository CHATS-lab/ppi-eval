[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-eval"
version = "0.1.0"
description = "Reproducibility code for prediction-powered MT system evaluation experiments."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "mt-metrics-eval>=0.0.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
